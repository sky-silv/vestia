<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudo para Vestibular com IA Gratuita</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    button { background: #f97316; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-weight: bold; }
    button:hover { background: #ea580c; }
    .resposta { margin-top: 15px; padding: 15px; background: #fff7ed; border-left: 4px solid #f97316; border-radius: 4px; }
  </style>
  <!-- Biblioteca do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h1>Plataforma de Estudos para Vestibular</h1>
  
  <div class="card">
    <button onclick="carregarQuestao()">Carregar Nova Questão</button>
  </div>

  <div id="area-questao" class="card" style="display:none;">
    <h3 id="materia"></h3>
    <p id="enunciado"></p>
    <div id="alternativas"></div>
    <button onclick="verificarEExplicar()">Verificar Gabarito e Pedir Explicação à IA</button>
    <div id="explicacao" class="resposta" style="display:none;"></div>
  </div>

  <script>
    // 1. DADOS DO SUPABASE
    const SUPABASE_URL = 'https://xcpvhqwotqxlkupeyznm.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_WeSJwV3otX-tt8AlklD0oQ_KvD58mym';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 2. CHAVE DA GROQ
    const GROQ_API_KEY = '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';

    let questaoAtual = null;

    async function carregarQuestao() {
      const { data, error } = await supabaseClient.from('questoes').select('*');
      if (error || !data || data.length === 0) {
        alert('Erro ao carregar questões do Supabase.');
        return;
      }
      
      questaoAtual = data[Math.floor(Math.random() * data.length)];
      
      document.getElementById('materia').innerText = questaoAtual.materia;
      document.getElementById('enunciado').innerText = questaoAtual.enunciado;
      
      const containerAlt = document.getElementById('alternativas');
      containerAlt.innerHTML = `
        <label><input type="radio" name="alt" value="A"> A) ${questaoAtual.alternativa_a}</label><br><br>
        <label><input type="radio" name="alt" value="B"> B) ${questaoAtual.alternativa_b}</label><br><br>
        <label><input type="radio" name="alt" value="C"> C) ${questaoAtual.alternativa_c}</label><br><br>
        <label><input type="radio" name="alt" value="D"> D) ${questaoAtual.alternativa_d}</label><br>
      `;
      
      document.getElementById('area-questao').style.display = 'block';
      document.getElementById('explicacao').style.display = 'none';
    }

    // Busca dinamicamente e filtra apenas modelos de texto (Chat) ativos
    async function obterModeloAtivoGroq() {
      const res = await fetch('https://api.groq.com/openai/v1/models', {
        headers: { 'Authorization': `Bearer ${GROQ_API_KEY}` }
      });
      
      if (!res.ok) {
        throw new Error('Falha ao autenticar na Groq. Verifique sua GROQ_API_KEY.');
      }
      
      const data = await res.json();
      const modelosDisponiveis = data.data.map(m => m.id);

      // Modelos de texto ativos conhecidos da Groq
      const listaPrioritaria = [
        'llama-3.3-70b-versatile',
        'llama-3.1-8b-instant',
        'llama-3.2-11b-vision-instruct',
        'llama-3.2-3b-preview',
        'mixtral-8x7b-32768',
        'gemma2-9b-it'
      ];

      // Tenta encontrar um modelo prioritário exato que esteja disponível na conta
      let modeloEscolhido = listaPrioritaria.find(p => modelosDisponiveis.includes(p));

      // Se não achar um exato, pega qualquer modelo seguro descartando áudio e restritos
      if (!modeloEscolhido) {
        modeloEscolhido = modelosDisponiveis.find(m => 
          !m.includes('canopylabs') && 
          !m.includes('whisper') && 
          !m.includes('guard') && 
          !m.includes('audio')
        );
      }

      if (!modeloEscolhido) {
        throw new Error('Nenhum modelo de texto compatível encontrado na Groq.');
      }

      return modeloEscolhido;
    }

    async function chamarGroq(prompt) {
      const modelo = await obterModeloAtivoGroq();

      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${GROQ_API_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          model: modelo,
          messages: [
            {
              role: 'system',
              content: 'Você é um professor especialista em vestibulares. Responda de forma didática, clara e objetiva.'
            },
            { role: 'user', content: prompt }
          ],
          temperature: 0.5
        })
      });

      const data = await response.json();
      
      if (!response.ok) {
        throw new Error(data.error?.message || `Erro no modelo ${modelo}`);
      }
      
      return data.choices[0].message.content;
    }

    async function verificarEExplicar() {
      const selecionada = document.querySelector('input[name="alt"]:checked');
      if (!selecionada) {
        alert('Selecione uma alternativa!');
        return;
      }

      const gabaritoOficial = String(questaoAtual.resposta_correta).toUpperCase().trim();
      const acertou = selecionada.value === gabaritoOficial;

      const divExp = document.getElementById('explicacao');
      divExp.style.display = 'block';
      divExp.innerHTML = `<b>Gerando explicação didática com a Groq...</b>`;

      const prompt = `Questão de ${questaoAtual.materia}:\n${questaoAtual.enunciado}\n\nAlternativas:\nA) ${questaoAtual.alternativa_a}\nB) ${questaoAtual.alternativa_b}\nC) ${questaoAtual.alternativa_c}\nD) ${questaoAtual.alternativa_d}\n\nGabarito Correto: Alternativa ${gabaritoOficial}.\n\nExplique de forma bem didática por que a alternativa ${gabaritoOficial} é a correta.`;

      try {
        const textoIA = await chamarGroq(prompt);

        divExp.innerHTML = `
          <h3>${acertou ? '✅ Você acertou!' : '❌ Você errou!'} (Gabarito: ${gabaritoOficial})</h3>
          <p><b>Explicação da IA:</b></p>
          <p>${textoIA.replace(/\n/g, '<br>')}</p>
        `;
      } catch (e) {
        console.error(e);
        divExp.innerHTML = `
          <h3>${acertou ? '✅ Você acertou!' : '❌ Você errou!'} (Gabarito: ${gabaritoOficial})</h3>
          <p style="color: red;"><b>Erro Groq:</b> ${e.message}</p>
        `;
      }
    }
  </script>
</body>
</html>
